# Settings for gemini_chat.py. Command-line flags override these.

# Language Gemini responds in, e.g. "English", "Spanish", "Japanese".
language = "Japanese"

# How complex Gemini's language should be, e.g. "beginner", "intermediate",
# "advanced", "native", or a CEFR level such as "A2" or "C1".
level = "beginner"

# Gemini model to use.
model = "gemini-3.5-flash-lite"
